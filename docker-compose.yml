version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sms-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-sms_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sms_user} -d ${POSTGRES_DB:-sms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (ASP.NET Core)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: sms-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5208}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-sms_db};Username=${POSTGRES_USER:-sms_user};Password=${POSTGRES_PASSWORD:-dev_password_123};Pooling=true;MinPoolSize=5;MaxPoolSize=100"
      ASPNETCORE_LOGGING__LOGLEVEL__DEFAULT: Information
      ASPNETCORE_LOGGING__LOGLEVEL__MICROSOFT: Warning
    volumes:
      - ./backend/src:/src:cached
    networks:
      - sms-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: sms-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-5208}
      VITE_APP_TITLE: School Management System
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    networks:
      - sms-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres-data:
    driver: local
    name: sms-postgres-data

networks:
  sms-network:
    driver: bridge
    name: sms-network
